<title>工具制造了新的工作</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}
body{margin:0;overflow:hidden;background:#fffaf7;color:#292526;font-family:"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
.stage{position:relative;width:100vw;height:100vh;padding:7vh 7vw;background:linear-gradient(90deg,rgba(242,218,225,.32) 1px,transparent 1px);background-size:25vw 100%}
.top{display:flex;justify-content:space-between;color:#94868a;font:600 13px ui-monospace,monospace;letter-spacing:.1em}
.main{display:flex;flex-direction:column;justify-content:center;height:80vh}
.main{position:relative}.resting{position:absolute;right:2%;top:4%;width:clamp(100px,10vw,180px);height:auto;mix-blend-mode:multiply;filter:saturate(.82);opacity:0;transform:translateY(10px) rotate(2deg);transition:.3s ease;pointer-events:none}
.eyebrow{margin-bottom:22px;color:#a25e6c;font:700 14px ui-monospace,monospace;letter-spacing:.16em}.eyebrow:before{content:"";display:inline-block;width:44px;height:2px;margin:0 13px 4px 0;background:#d99cab}
h1{max-width:12em;margin:0;font:600 clamp(58px,5.7vw,110px)/1.1 "Songti SC","STSong",serif;letter-spacing:-.018em}h1 em{color:#a25e6c;font-style:normal}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:7vh}
.step{position:relative;min-height:145px;padding:28px;border:1px solid #eadde0;border-radius:20px;background:rgba(255,255,255,.85);box-shadow:0 14px 35px rgba(84,54,62,.05);opacity:0;transform:translateY(12px);transition:.3s ease}
.step:not(:last-child):after{content:"→";position:absolute;right:-15px;top:50%;z-index:2;color:#c98999;font:500 20px/1 ui-monospace,monospace}
.step small{display:block;margin-bottom:18px;color:#c27e8e;font:700 12px ui-monospace,monospace}.step b{font:600 clamp(26px,2vw,39px) "Songti SC",serif}
.conclusion{align-self:flex-end;margin-top:32px;padding:14px 22px;background:#f3dce2;color:#563f45;font:600 clamp(20px,1.5vw,29px) "Songti SC",serif;opacity:0;transform:translateY(10px) rotate(-1deg);transition:.3s ease}
body[data-step="1"] .s1,body[data-step="2"] .s1,body[data-step="2"] .s2,body[data-step="3"] .s1,body[data-step="3"] .s2,body[data-step="3"] .s3,body[data-step="4"] .step,body[data-step="5"] .step{opacity:1;transform:none}body[data-step="5"] .conclusion{opacity:1;transform:rotate(-1deg)}
body[data-step="5"] .resting{opacity:1;transform:rotate(2deg)}
.hint{position:absolute;right:7vw;bottom:4vh;color:#9b8c90;font:600 12px ui-monospace,monospace}.hint:before{content:"→";margin-right:9px;color:#a25e6c}
@media(max-width:800px){h1{font-size:52px}.flow{grid-template-columns:repeat(2,1fr);margin-top:4vh}.step{min-height:100px}}
</style>
