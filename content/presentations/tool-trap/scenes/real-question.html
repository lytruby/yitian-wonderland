<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从真实麻烦开始</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#fffaf7;color:#292526;font-family:"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}.stage{position:relative;width:100vw;height:100vh;padding:7vh 7vw;background:linear-gradient(90deg,rgba(242,218,225,.32) 1px,transparent 1px);background-size:25vw 100%}.top{display:flex;justify-content:space-between;color:#94868a;font:600 13px ui-monospace,monospace;letter-spacing:.1em}.main{display:grid;place-items:center;height:80vh;text-align:center}.wrap{width:min(1150px,88vw)}.label{color:#a25e6c;font:700 14px ui-monospace,monospace;letter-spacing:.18em}.old{margin:32px auto 0;color:#aa9da0;font:500 clamp(24px,2.2vw,43px)/1.35 "Songti SC",serif;text-decoration:line-through;text-decoration-thickness:2px;opacity:0;transform:translateY(10px);transition:.3s ease}.line{width:1px;height:0;margin:27px auto;background:#d99cab;transition:.35s ease}.question{margin:0;font:600 clamp(57px,6.2vw,118px)/1.08 "Songti SC","STSong",serif;letter-spacing:-.03em;opacity:0;transform:translateY(12px);transition:.35s ease}.question em{color:#a25e6c;font-style:normal}.answer{display:inline-block;margin-top:37px;padding:14px 24px;background:#f3dce2;color:#563f45;font:600 clamp(19px,1.45vw,28px) "Songti SC",serif;opacity:0;transform:translateY(10px) rotate(-1deg);transition:.3s ease}body[data-step="1"] .old,body[data-step="2"] .old,body[data-step="3"] .old{opacity:1;transform:none}body[data-step="2"] .line,body[data-step="3"] .line{height:50px}body[data-step="2"] .question,body[data-step="3"] .question{opacity:1;transform:none}body[data-step="3"] .answer{opacity:1;transform:rotate(-1deg)}.footer{position:absolute;left:7vw;right:7vw;bottom:4vh;display:flex;justify-content:space-between;color:#9b8c90;font:600 12px ui-monospace,monospace}.footer strong{color:#292526;font-weight:600}@media(max-width:700px){.question{font-size:48px}.footer strong{display:none}}
</style></head><body data-step="0"><main class="stage"><header class="top"><span>TOOL TRAP · START HERE</span><span>07 / 07</span></header><section class="main"><div class="wrap"><div class="label">最后，只问自己一个问题</div><div class="old">我还缺什么 AI 工具？</div><div class="line"></div><h1 class="question">我现在到底有什么<br><em>真正的麻烦？</em></h1><div class="answer">从那里开始，就好了。</div></div></section><footer class="footer"><span>CLICK TO REFRAME</span><strong>先做一个真正属于自己的小工具</strong></footer></main><script>let step=0;const max=3;const draw=()=>document.body.dataset.step=step;addEventListener('click',()=>{step=Math.min(max,step+1);draw()});addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key===' '){step=Math.min(max,step+1);draw()}if(event.key==='ArrowLeft'){step=Math.max(0,step-1);draw()}});</script></body></html>
