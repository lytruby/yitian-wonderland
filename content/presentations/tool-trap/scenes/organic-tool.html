<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从小需求开始</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#fffaf7;color:#292526;font-family:"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}.stage{position:relative;width:100vw;height:100vh;padding:7vh 7vw;background:linear-gradient(90deg,rgba(242,218,225,.32) 1px,transparent 1px);background-size:25vw 100%}.top{display:flex;justify-content:space-between;color:#94868a;font:600 13px ui-monospace,monospace;letter-spacing:.1em}.main{display:grid;grid-template-columns:1fr 1fr;gap:8vw;align-items:center;height:82vh}.eyebrow{margin-bottom:22px;color:#a25e6c;font:700 14px ui-monospace,monospace;letter-spacing:.16em}.eyebrow:before{content:"";display:inline-block;width:44px;height:2px;margin:0 13px 4px 0;background:#d99cab}h1{max-width:8.5em;margin:0;font:600 clamp(60px,6vw,115px)/1.1 "Songti SC","STSong",serif;letter-spacing:-.018em}h1 em{color:#a25e6c;font-style:normal}.need{margin-top:38px;color:#71666a;font:500 clamp(19px,1.35vw,27px)/1.6 "Songti SC",serif}.need strong{padding:3px 7px;background:#f3dce2;color:#563f45;font-weight:600}.path{position:relative;display:grid;gap:24px}.path:before{content:"";position:absolute;left:31px;top:50px;bottom:50px;width:1px;background:#e5c9d0}.step{position:relative;display:flex;align-items:center;gap:26px;min-height:116px;padding:22px 27px;border:1px solid #eadde0;border-radius:20px;background:rgba(255,255,255,.88);box-shadow:0 14px 35px rgba(84,54,62,.05);opacity:0;transform:translateY(12px);transition:.3s ease}.num{z-index:1;display:grid;place-items:center;flex:0 0 42px;aspect-ratio:1;border-radius:50%;background:#f3dce2;color:#a25e6c;font:700 12px ui-monospace,monospace}.step b{font:600 clamp(25px,1.9vw,37px) "Songti SC",serif}.step small{display:block;margin-top:8px;color:#8a7c80;font-size:14px}body[data-step="1"] .s1,body[data-step="2"] .s1,body[data-step="2"] .s2,body[data-step="3"] .step{opacity:1;transform:none}.hint{position:absolute;right:7vw;bottom:4vh;color:#9b8c90;font:600 12px ui-monospace,monospace}.hint:before{content:"→";margin-right:9px;color:#a25e6c}@media(max-width:800px){.main{grid-template-columns:1fr;gap:4vh}h1{font-size:52px}.path{gap:12px}.step{min-height:80px}}
</style></head><body data-step="0"><main class="stage"><header class="top"><span>TOOL TRAP · START SMALL</span><span>04 / 07</span></header><section class="main"><div><div class="eyebrow">换一个思路</div><h1>让工具从<em>自己的需求</em>里长出来</h1><p class="need">从一个<strong>非常具体、非常小</strong>的麻烦开始。</p></div><div class="path"><article class="step s1"><span class="num">01</span><div><b>需要什么，先做什么</b><small>不先设计完整系统</small></div></article><article class="step s2"><span class="num">02</span><div><b>先真正用起来</b><small>让使用暴露问题</small></div></article><article class="step s3"><span class="num">03</span><div><b>再长出新功能</b><small>哪里不顺手，就改哪里</small></div></article></div></section><div class="hint">点击逐项展示</div></main><script>let step=0;const max=3;const draw=()=>document.body.dataset.step=step;addEventListener('click',()=>{step=Math.min(max,step+1);draw()});addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key===' '){step=Math.min(max,step+1);draw()}if(event.key==='ArrowLeft'){step=Math.max(0,step-1);draw()}});</script></body></html>
