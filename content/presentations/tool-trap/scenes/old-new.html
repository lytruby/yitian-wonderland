<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的录视频辅助工具</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#fffaf7;color:#292526;font-family:"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}.stage{position:relative;width:100vw;height:100vh;padding:6vh 6vw;background:linear-gradient(90deg,rgba(242,218,225,.32) 1px,transparent 1px);background-size:25vw 100%}.top{display:flex;justify-content:space-between;color:#94868a;font:600 13px ui-monospace,monospace;letter-spacing:.1em}.heading{display:flex;justify-content:space-between;align-items:end;margin:4vh 0 3vh}.eyebrow{color:#a25e6c;font:700 14px ui-monospace,monospace;letter-spacing:.16em}.heading h1{margin:10px 0 0;font:600 clamp(43px,4.2vw,78px)/1.08 "Songti SC","STSong",serif;letter-spacing:-.018em}.time{padding:10px 17px;background:#f3dce2;color:#563f45;font:600 17px "Songti SC",serif;transform:rotate(1deg)}.tool{display:grid;grid-template-columns:.85fr 1.15fr;gap:14px;width:100%;height:53vh;padding:14px;border:1px solid #e5d4d8;border-radius:23px;background:#f4e3e7;box-shadow:0 22px 60px rgba(84,54,62,.09)}.panel{position:relative;overflow:hidden;border:1px solid #eadde0;border-radius:15px;background:#fff}.bar{height:43px;padding:14px 17px;border-bottom:1px solid #eee3e5;color:#8f8084;font:700 11px/1 ui-monospace,monospace;letter-spacing:.08em}.script{padding:25px;color:#64595c;font:500 clamp(16px,1.08vw,21px)/1.85 "Songti SC",serif}.script .active{display:block;margin:13px -9px;padding:10px 9px;background:#f8ecef;color:#352e30}.preview{display:grid;place-items:center;padding:34px;background:#fffdfb}.slide{width:92%;aspect-ratio:16/9;padding:7%;border:1px solid #eadde0;background:#fffaf7}.slide small{color:#a25e6c;font:700 10px ui-monospace,monospace;letter-spacing:.13em}.slide h2{max-width:8em;margin:10% 0 0;font:600 clamp(28px,2.4vw,47px)/1.2 "Songti SC",serif}.controls{position:absolute;right:18px;bottom:17px;display:flex;gap:8px}.button{padding:9px 14px;border-radius:999px;background:#f3dce2;color:#563f45;font:700 11px ui-monospace,monospace}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:3vh}.feature{font:600 clamp(18px,1.35vw,26px) "Songti SC",serif;opacity:0;transform:translateY(9px);transition:.3s ease}.feature span{margin-right:10px;color:#c27e8e;font:700 11px ui-monospace,monospace}body[data-step="1"] .f1,body[data-step="2"] .f1,body[data-step="2"] .f2,body[data-step="3"] .feature{opacity:1;transform:none}.hint{position:absolute;right:6vw;bottom:3vh;color:#9b8c90;font:600 12px ui-monospace,monospace}.hint:before{content:"→";margin-right:9px;color:#a25e6c}@media(max-width:800px){.tool{grid-template-columns:1fr}.panel:first-child{display:none}.features{grid-template-columns:1fr}.heading h1{font-size:45px}}
</style></head><body data-step="0"><main class="stage"><header class="top"><span>MY TINY TOOL · CASE</span><span>05 / 07</span></header><section class="heading"><div><div class="eyebrow">半小时 VIBE CODING</div><h1>我做了一个录视频辅助工具</h1></div><div class="time">只服务我自己的习惯</div></section><section class="tool"><article class="panel"><div class="bar">SCRIPT · 口播稿</div><div class="script">最近我上网冲浪特别疲惫……<span class="active">左边写口播稿，右边生成对应的展示画面。</span>哪里不顺手，就再改一点。</div></article><article class="panel preview"><div class="bar" style="position:absolute;inset:0 0 auto">PREVIEW · HTML 画面</div><div class="slide"><small>REAL TINY NEED</small><h2>一边看稿，一边看到画面。</h2></div><div class="controls"><span class="button">录制口播</span><span class="button">开始演示 →</span></div></article></section><div class="features"><div class="feature f1"><span>01</span>文字稿与画面对照</div><div class="feature f2"><span>02</span>生成 HTML 页面</div><div class="feature f3"><span>03</span>一键开始演示</div></div><div class="hint">点击逐项展示</div></main><script>let step=0;const max=3;const draw=()=>document.body.dataset.step=step;addEventListener('click',()=>{step=Math.min(max,step+1);draw()});addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key===' '){step=Math.min(max,step+1);draw()}if(event.key==='ArrowLeft'){step=Math.max(0,step-1);draw()}});</script></body></html>
