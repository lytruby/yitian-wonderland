<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#fffaf7;color:#292526;font-family:"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}.stage{position:relative;width:100vw;height:100vh;padding:7vh 7vw;background:linear-gradient(90deg,rgba(242,218,225,.32) 1px,transparent 1px);background-size:25vw 100%}.top{display:flex;justify-content:space-between;color:#94868a;font:600 13px ui-monospace,monospace;letter-spacing:.1em}.main{display:grid;grid-template-columns:1.05fr .95fr;gap:8vw;align-items:center;height:82vh}.eyebrow{margin-bottom:22px;color:#a25e6c;font:700 14px ui-monospace,monospace;letter-spacing:.16em}.eyebrow:before{content:"";display:inline-block;width:44px;height:2px;margin:0 13px 4px 0;background:#d99cab}h1{max-width:9em;margin:0;font:600 clamp(58px,5.8vw,112px)/1.11 "Songti SC","STSong",serif;letter-spacing:-.018em}h1 em{color:#a25e6c;font-style:normal}.release{margin-top:38px;color:#756a6d;font:500 clamp(19px,1.4vw,27px)/1.6 "Songti SC",serif;opacity:0;transform:translateY(10px);transition:.3s ease}.release strong{color:#292526}.templates{position:relative;height:59vh}.card{position:absolute;left:50%;top:50%;width:76%;min-height:37vh;padding:38px;border:1px solid #e5d4d8;border-radius:22px;background:#fff;box-shadow:0 20px 55px rgba(84,54,62,.08);transition:.35s ease}.back1{transform:translate(-50%,-50%) rotate(-7deg);background:#f3dce2}.back2{transform:translate(-50%,-50%) rotate(6deg);background:#f8ecef}.front{transform:translate(-50%,-50%);display:flex;flex-direction:column;justify-content:center}.front small{color:#a25e6c;font:700 12px ui-monospace,monospace;letter-spacing:.12em}.front b{margin-top:25px;font:600 clamp(30px,2.6vw,51px)/1.25 "Songti SC",serif}.front p{margin:22px 0 0;color:#88797d;font-size:17px}.mine{position:absolute;left:50%;bottom:0;padding:15px 23px;background:#292526;color:#fffaf7;font:600 clamp(18px,1.35vw,26px) "Songti SC",serif;opacity:0;transform:translate(-50%,10px) rotate(-1deg);transition:.3s ease;white-space:nowrap}body[data-step="1"] .back1{transform:translate(-63%,-52%) rotate(-11deg)}body[data-step="1"] .back2{transform:translate(-37%,-48%) rotate(10deg)}body[data-step="2"] .back1,body[data-step="3"] .back1{transform:translate(-82%,-50%) rotate(-13deg);opacity:.45}body[data-step="2"] .back2,body[data-step="3"] .back2{transform:translate(-18%,-50%) rotate(12deg);opacity:.45}body[data-step="2"] .front,body[data-step="3"] .front{border-color:#d99cab;box-shadow:0 25px 65px rgba(162,94,108,.13)}body[data-step="3"] .mine{opacity:1;transform:translateX(-50%) rotate(-1deg)}body[data-step="3"] .release{opacity:1;transform:none}.hint{position:absolute;right:7vw;bottom:4vh;color:#9b8c90;font:600 12px ui-monospace,monospace}.hint:before{content:"→";margin-right:9px;color:#a25e6c}@media(max-width:800px){.main{grid-template-columns:1fr}.templates{height:38vh}h1{font-size:50px}.release{display:none}}
</style></head><body data-step="0"><main class="stage"><header class="top"><span>TOOL TRAP · YOUR OWN WAY</span><span>06 / 07</span></header><section class="main"><div><div class="eyebrow">AI 让定制工具变得很便宜</div><h1>不用把自己硬塞进别人的<em>效率模板</em></h1><p class="release">不需要“第二大脑”，也不用假装自己很有秩序。<br><strong>工具可以贴合真实的你。</strong></p></div><div class="templates"><div class="card back1"></div><div class="card back2"></div><article class="card front"><small>PERFECT PRODUCTIVITY SYSTEM</small><b>请先改变自己，<br>再来使用我。</b><p>文件夹 · 标签 · 双链 · 自动化 · 每周复盘</p></article><div class="mine">不，我要做自己的工具。</div></div></section><div class="hint">点击拆开模板</div></main><script>let step=0;const max=3;const draw=()=>document.body.dataset.step=step;addEventListener('click',()=>{step=Math.min(max,step+1);draw()});addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key===' '){step=Math.min(max,step+1);draw()}if(event.key==='ArrowLeft'){step=Math.max(0,step-1);draw()}});</script></body></html>
